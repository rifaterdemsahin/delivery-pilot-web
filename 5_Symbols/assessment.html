      // Loading animation timing constants (in milliseconds)
      const LOADING_STAGE_1_DELAY = 800;
      const LOADING_STAGE_2_DELAY = 800;
      const LOADING_STAGE_3_DELAY = 500;
      const LOADING_FINAL_DELAY = 300;

      const [step, setStep] = useState("intro");
      const [userInfo, setUserInfo] = useState({
        name: "",
        org: "",
        role: "",
        email: "",
        experience: "",
      });
      const [answers, setAnswers] = useState({});
      const [currentQ, setCurrentQ] = useState(0);
      const [language, setLanguage] = useState("en");
      const [submitted, setSubmitted] = useState(false);
      const [loadingStep, setLoadingStep] = useState(0);

      const t = translations[language];
      const categories = categoriesData[language];
      const questions = questionsData[language];

      const handleAnswer = (qId, value) => {
        setAnswers({ ...answers, [qId]: value });
        if (currentQ < questions.length - 1) {
          setTimeout(() => setCurrentQ(currentQ + 1), 300);
        }
      };

      const calcScores = () => {
        const scores = {};
        categories.forEach((cat) => {
          const catQs = questions.filter((q) => q.cat === cat.id);
          const total = catQs.reduce(
            (sum, q) => sum + (answers[q.id] || 0),
            0
          );
          scores[cat.id] = Math.round((total / (catQs.length * 3)) * 100);
        });
        scores.overall = Math.round(
          Object.values(scores).reduce((a, b) => a + b, 0) / categories.length
        );
        return scores;
      };

      const getLevel = (score) =>
        score < 25 ? 1 : score < 50 ? 2 : score < 75 ? 3 : 4;

      const getWorkshopReadiness = (scores) => {
        const avg = scores.overall;
        if (avg < 25)
          return {
            level: "Foundation Training",
            desc: "Start with basics and hands-on practice",
            icon: "📚",
            weeks: "4-6 weeks",
          };
        if (avg < 50)
          return {
            level: "Intermediate Track",
            desc: "Ready for guided workshops with peer support",
            icon: "🌱",
            weeks: "2-3 weeks",
          };
        if (avg < 75)
          return {
            level: "Advanced Track",
            desc: "Can lead collaborative sessions and projects",
            icon: "⚡",
            weeks: "1-2 weeks",
          };
        return {
          level: "Expert Facilitator",
          desc: "Ready to mentor and design workshops",
          icon: "🚀",
          weeks: "Immediate",
        };
      };

        const recs = [];
        categories.forEach((cat) => {
          const score = scores[cat.id];
          const catInfo = categories.find((c) => c.id === cat.id);
          if (score < 50) {
            recs.push({
              priority: score < 25 ? "Critical" : "High",
              area: catInfo.name,
              emoji: catInfo.emoji,
              score,
              actions: getActions(cat.id, score),
            });
          }
        });
        return recs.sort((a, b) => {
          const order = { Critical: 0, High: 1, Medium: 2 };
          return order[a.priority] - order[b.priority];

              ]
              : [
                "Optimize multi-device setup",
                "Configure second brain system",
              ],
          creative:
            score < 25
              ? [
                "Complete Canva basics tutorial",
                "Practice whiteboard features",
                "Try collaborative editing",
              ]
              : [
                "Master timeline organization",
                "Lead collaborative sessions",
              ],
          comm:
            score < 25
              ? [
                "Practice screen sharing",
                "Learn Teams formatting",
                "Use reactions and raise hand",
              ]
              : ["Lead multi-team calls", "Set up breakout rooms"],
          ai:
            score < 25
              ? [
                "Sign up for all major AI tools",
                "Practice basic prompting",
                "Try image generation",
              ]
              : ["Master prompt engineering", "Integrate AI into workflow"],
          github:
            score < 25
              ? [
                "Create GitHub account",
                "Clone first repository",
                "Make first commit",
              ]
              : ["Master PR workflows", "Set up Codespaces environment"],
          markdown:
            score < 25
              ? [
                "Learn Markdown basics",
                "Practice with README files",
                "Create first document",
              ]
              : [
                "Build Markdown presentations",
                "Master advanced formatting",
              ],
          advanced:
            score < 25
              ? [
                "Install LM Studio or Ollama",
                "Try AI CLI tools",
                "Learn about MCP",
              ]
              : ["Train local models", "Build AI-powered workflows"],
          delivery:
            score < 25
              ? [
                "Define first project OKRs",
                "Set up development environment",
                "Complete small AI project",
              ]
              : [
                "Lead full delivery cycle",
                "Mentor others on best practices",
              ],
        };
        return actionMap[catId] || [];
      };

      const generateRoadmap = (scores) => {
        const phases = [];
        const weakest = Object.entries(scores)
          .filter(([k]) => k !== "overall")
          .sort((a, b) => a[1] - b[1]);

        phases.push({
          phase: "Week 1-2: Foundation",
          focus: weakest
            .slice(0, 3)
            .map(([k]) => categories.find((c) => c.id === k)?.name),
          goals: [
            "Complete prerequisite setup",
            "Master basic tools",
            "First collaborative session",
          ],
        });
        phases.push({
          phase: "Week 3-4: Building Skills",
          focus: weakest
            .slice(3, 5)
            .map(([k]) => categories.find((c) => c.id === k)?.name),
          goals: [
            "AI tools proficiency",
            "GitHub workflows",
            "Documentation practice",
          ],
        });
        phases.push({
          phase: "Week 5-6: Project Delivery",
          focus: ["Complete Pilot Project"],
          goals: [
            "End-to-end project delivery",
            "Team collaboration",
            "Share learnings",
          ],
        });
        return phases;
      };

      const prepareAssessmentData = () => {
        const scores = calcScores();
        const overallLevel = getLevel(scores.overall);
        return {
          metadata: {
            generatedAt: new Date().toISOString(),
            assessmentType: "AI Workshop Maturity",
            language,
          },
          userInfo,
          scores,
          overallLevel,
          levelName: levelColors[overallLevel].name,
          workshopReadiness: getWorkshopReadiness(scores),
          answers: Object.entries(answers).map(([qId, ans]) => {
            const q = questions.find((qu) => qu.id === parseInt(qId));
            return {
              question: q.q,
              category: q.cat,
              answer: q.opts[ans],
              score: ans,
            };
          }),
          recommendations: getRecommendations(scores),
          roadmap: generateRoadmap(scores),
        };
      };

      const submitToN8n = async (data) => {
        try {
          const response = await fetch(
            "https://n8n.rifaterdemsahin.com/webhook/cf41ca7a-08d2-4e11-8fd6-a45ea481d52f",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify(data),
            }
          );
          return response.ok;
        } catch (error) {
          console.error("Failed to submit to n8n:", error);
          return false;
        }
      };

      const printResults = () => {
        window.print();
      };

      React.useEffect(() => {
        if (step === "loading" && !submitted) {
          const submitData = async () => {
            try {
              // Step 1: Show submitting message
              setLoadingStep(1);
              // Capture assessment data at submission time
              const data = prepareAssessmentData();

              // Step 2: Submit to n8n with brief UX delay
              await new Promise(resolve => setTimeout(resolve, LOADING_STAGE_1_DELAY));
              await submitToN8n(data);

              // Step 3: Show generating message
              setLoadingStep(2);
              await new Promise(resolve => setTimeout(resolve, LOADING_STAGE_2_DELAY));

              // Step 4: Show almost done message
              setLoadingStep(3);
              await new Promise(resolve => setTimeout(resolve, LOADING_STAGE_3_DELAY));

              setSubmitted(true);

              // Step 5: Move to results
              setTimeout(() => {
                setStep("results");
              }, LOADING_FINAL_DELAY);
            } catch (err) {
              console.error("Submission failed:", err);
              // Still show results even if submission fails
              setSubmitted(true);
              setStep("results");
            }
          };

          submitData();
        }
        // Note: Dependencies are intentionally limited to step and submitted
        // Data (userInfo, answers, language) is captured when loading starts
        // eslint-disable-next-line react-hooks/exhaustive-deps
      }, [step, submitted]);

      React.useEffect(() => {
        const navWrapper = document.getElementById("nav-wrapper");
        if (navWrapper) {
          if (step === "results") {
            navWrapper.style.display = "block";
          } else {
            navWrapper.style.display = "none";
          }
        }
      }, [step]);

      const resetAssessment = () => {
        setStep("intro");
        setAnswers({});
        setCurrentQ(0);
        setSubmitted(false);
        setLoadingStep(0);
      };

      if (step === "intro") {
        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-4 flex items-center justify-center">
            <div className="max-w-3xl w-full bg-white/10 backdrop-blur-lg rounded-2xl p-6 text-white">
              <div className="flex justify-between items-center mb-4">
                <a
                  href="upskilling_pathways.html"
                  className="flex items-center gap-2 text-white bg-white/20 hover:bg-white/30 px-3 py-1.5 rounded-lg transition text-sm font-medium no-underline"
                >
                  <span>←</span> Back to Pathways
                </a>
                <div className="flex gap-2 bg-white/20 rounded-lg p-1">
                  <button
                    onClick={() => setLanguage("en")}
                    className={`px-4 py-2 rounded-md text-sm font-medium transition ${language === "en"
                        ? "bg-white text-purple-900"
                        : "text-white hover:bg-white/10"
                      }`}
                  >
                    🇬🇧 English
                  </button>
                  <button
                    onClick={() => setLanguage("tr")}
                    className={`px-4 py-2 rounded-md text-sm font-medium transition ${language === "tr"
                        ? "bg-white text-purple-900"
                        : "text-white hover:bg-white/10"
                      }`}
                  >
                    🇹🇷 Türkçe
                  </button>
                </div>
              </div>
              <div className="text-center mb-6">
                <div className="text-6xl mb-3">🎓</div>
                <h1 className="text-3xl font-bold mb-2">{t.title}</h1>
                <p className="text-gray-300 text-sm">{t.subtitle}</p>
                <p className="text-yellow-300 text-xs mt-2">{t.tagline}</p>
              </div>

              <div className="bg-purple-500/20 border border-purple-400/30 rounded-lg p-4 mb-4">
                <h2 className="font-bold text-purple-200 mb-2 flex items-center gap-2">
                  <span>⚡</span> {t.raiseTitle}
                </h2>
                <p className="text-sm text-purple-100">
                  {t.raiseDescription}
                </p>
              </div>

              <div className="bg-blue-500/20 border border-blue-400/30 rounded-lg p-4 mb-6">
                <h2 className="font-bold text-blue-200 mb-2 flex items-center gap-2">
                  <span>📋</span> {t.prereqTitle}
                </h2>
                <div className="text-sm text-blue-100 space-y-1">
                  {t.prereqItems.map((item, i) => (
                    <p key={i}>• {item}</p>
                  ))}
                </div>
              </div>

              <div className="grid grid-cols-2 md:grid-cols-4 gap-2 mb-6">
                {categories.map((cat) => (
                  <div
                    key={cat.id}
                    className={`bg-gradient-to-r ${cat.color} rounded-lg p-3 text-center`}
                  >
                    <div className="text-2xl">{cat.emoji}</div>
                    <div className="text-xs mt-1 font-medium">{cat.name}</div>
                  </div>
                ))}
              </div>

              <div className="space-y-3 mb-4">
                <input
                  className="w-full p-3 rounded-lg bg-white/20 border border-white/30 placeholder-gray-400 text-sm text-white"
                  placeholder={t.namePlaceholder}
                  value={userInfo.name}
                  onChange={(e) =>
                    setUserInfo({ ...userInfo, name: e.target.value })
                  }
                />
                <input
                  className="w-full p-3 rounded-lg bg-white/20 border border-white/30 placeholder-gray-400 text-sm text-white"
                  placeholder={t.orgPlaceholder}
                  value={userInfo.org}
                  onChange={(e) =>
                    setUserInfo({ ...userInfo, org: e.target.value })
                  }
                />
                <input
                  className="w-full p-3 rounded-lg bg-white/20 border border-white/30 placeholder-gray-400 text-sm text-white"
                  placeholder={t.rolePlaceholder}
                  value={userInfo.role}
                  onChange={(e) =>
                    setUserInfo({ ...userInfo, role: e.target.value })
                  }
                />
                <input
                  className="w-full p-3 rounded-lg bg-white/20 border border-white/30 placeholder-gray-400 text-sm text-white"
                  placeholder={t.emailPlaceholder}
                  type="email"
                  value={userInfo.email}
                  onChange={(e) =>
                    setUserInfo({ ...userInfo, email: e.target.value })
                  }
                />
                <select
                  className="w-full p-3 rounded-lg bg-white/20 border border-white/30 text-sm text-white"
                  value={userInfo.experience}
                  onChange={(e) =>
                    setUserInfo({ ...userInfo, experience: e.target.value })
                  }
                >
                  <option value="" className="text-gray-900">
                    {t.experienceLabel}
                  </option>
                  <option value="none" className="text-gray-900">
                    {t.experienceOptions[0]}
                  </option>
                  <option value="beginner" className="text-gray-900">
                    {t.experienceOptions[1]}
                  </option>
                  <option value="intermediate" className="text-gray-900">
                    {t.experienceOptions[2]}
                  </option>
                  <option value="advanced" className="text-gray-900">
                    {t.experienceOptions[3]}
                  </option>
                </select>
              </div>

              <button
                onClick={() => setStep("questions")}
                disabled={
                  !userInfo.name || !userInfo.org || !userInfo.experience
                }
                className="w-full py-3 bg-gradient-to-r from-green-500 to-emerald-600 rounded-lg font-bold hover:opacity-90 transition disabled:opacity-50 disabled:cursor-not-allowed"
              >
                {t.startButton}
              </button>
            </div>
          </div>
        );
      }

      if (step === "questions") {
        const q = questions[currentQ];
        const cat = categories.find((c) => c.id === q.cat);
        const progress = ((currentQ + 1) / questions.length) * 100;
        const answered = Object.keys(answers).length;

        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-4">
            <div className="max-w-3xl mx-auto">
              <div className="mb-4">
                <div className="flex justify-between text-white text-xs mb-2">
                  <span>
                    {t.questionOf} {currentQ + 1} {t.of} {questions.length}
                  </span>
                  <span>
                    {answered} {t.answered} • {Math.round(progress)}%{" "}
                    {t.complete}
                  </span>
                </div>
                <div className="h-2 bg-white/20 rounded-full overflow-hidden">
                  <div
                    className="h-full bg-gradient-to-r from-green-400 to-emerald-500 transition-all duration-500"
                    style={{ width: `${progress}%` }}
                  />
                </div>
              </div>

              <div
                className={`bg-gradient-to-r ${cat.color} rounded-t-xl p-4 flex items-center gap-3`}
              >
                <span className="text-3xl">{cat.emoji}</span>
                <div>
                  <span className="text-white font-bold text-base">
                    {cat.name}
                  </span>
                  <p className="text-white/80 text-xs">
                    {t.category}{" "}
                    {categories.findIndex((c) => c.id === cat.id) + 1} {t.of}{" "}
                    {categories.length}
                  </p>
                </div>
              </div>

              <div className="bg-white rounded-b-xl p-6 shadow-2xl">
                <h2 className="text-xl font-bold text-gray-800 mb-5">
                  {q.q}
                </h2>
                <div className="space-y-3">
                  {q.opts.map((opt, i) => (
                    <button
                      key={i}
                      onClick={() => handleAnswer(q.id, i)}
                      className={`w-full p-4 rounded-lg border-2 text-left transition-all ${answers[q.id] === i
                          ? "border-purple-500 bg-purple-50 shadow-md"
                          : "border-gray-200 hover:border-purple-300 hover:bg-gray-50"
                        }`}
                    >
                      <div className="flex items-center gap-3">
                        <div
                          className={`w-8 h-8 rounded-full flex items-center justify-center text-lg font-bold ${answers[q.id] === i
                              ? "bg-purple-500 text-white"
                              : "bg-gray-100 text-gray-500"
                            }`}
                        >
                          {["🔴", "🟠", "🟡", "🟢"][i]}
                        </div>
                        <span className="text-sm font-medium flex-1">
                          {opt}
                        </span>
                        {answers[q.id] === i && (
                          <span className="text-purple-500 text-xl">✓</span>
                        )}
                      </div>
                    </button>
                  ))}
                </div>

                <div className="flex gap-3 mt-6">
                  <button
                    onClick={() => setCurrentQ(Math.max(0, currentQ - 1))}
                    disabled={currentQ === 0}
                    className="px-5 py-2 bg-gray-200 rounded-lg text-sm font-medium disabled:opacity-50 hover:bg-gray-300 transition"
                  >
                    {t.backButton}
                  </button>
                  {currentQ < questions.length - 1 ? (
                    <button
                      onClick={() => setCurrentQ(currentQ + 1)}
                      className="flex-1 py-2 bg-purple-600 text-white rounded-lg text-sm font-medium hover:bg-purple-700 transition"
                    >
                      {t.nextButton}
                    </button>
                  ) : (
                    <button
                      onClick={() => setStep("loading")}
                      className="flex-1 py-2 bg-green-600 text-white rounded-lg text-sm font-medium hover:bg-green-700 transition"
                    >
                      {t.finishButton}
                    </button>
                  )}
                </div>
              </div>
            </div>
          </div>
        );
      }

      if (step === "loading") {
        const loadingMessages = [
          t.loadingSubmitting,
          t.loadingGenerating,
          t.loadingAlmostDone
        ];

        // Helper function to get CSS classes based on loading step state
        // stepNumber: 1-3, loadingStep: 0-3 (0=not started, 1-3=active stages)
        const getStepClasses = (stepNumber) => {
          if (loadingStep > stepNumber) {
            // Step completed
            return "bg-green-500/30 border-2 border-green-400";
          } else if (loadingStep === stepNumber) {
            // Step currently active
            return "bg-purple-500/30 border-2 border-purple-400 animate-pulse";
          } else {
            // Step not yet started
            return "bg-white/5 border-2 border-white/10";
          }
        };

        // Helper function to render step icon based on state
        const renderStepIcon = (stepNumber) => {
          if (loadingStep > stepNumber) {
            return <span className="text-2xl">✅</span>;
          } else if (loadingStep === stepNumber) {
            return <div className="animate-spin rounded-full h-6 w-6 border-2 border-white border-t-transparent"></div>;
          } else {
            return <span className="text-2xl opacity-30">⏳</span>;
          }
        };

        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-4 flex items-center justify-center">
            <div className="max-w-md w-full bg-white/10 backdrop-blur-lg rounded-2xl p-8 text-white text-center">
              <div className="mb-6">
                <div className="inline-block animate-spin rounded-full h-16 w-16 border-4 border-white border-t-transparent mb-4"></div>
                <h2 className="text-2xl font-bold mb-2">{t.loadingTitle}</h2>
                <p className="text-purple-200 text-sm">{t.loadingMessage}</p>
              </div>

              <div className="space-y-3">
                {loadingMessages.map((msg, idx) => {
                  const stepNumber = idx + 1; // Convert 0-based index to 1-based step number
                  return (
                    <div
                      key={`loading-step-${stepNumber}`}
                      className={`flex items-center gap-3 p-3 rounded-lg transition-all ${getStepClasses(stepNumber)}`}
                    >
                      {renderStepIcon(stepNumber)}
                      <span className={`text-sm ${loadingStep >= stepNumber ? "font-semibold" : "opacity-50"}`}>
                        {msg}
                      </span>
                    </div>
                  );
                })}
              </div>
            </div>
          </div>
        );
      }

      if (step === "results") {
        const scores = calcScores();
        const overallLevel = getLevel(scores.overall);
        const readiness = getWorkshopReadiness(scores);
        const recommendations = getRecommendations(scores);
        const roadmap = generateRoadmap(scores);

        return (
          <div className="min-h-screen bg-gradient-to-br from-slate-900 via-purple-900 to-slate-900 p-4">
            <div className="max-w-5xl mx-auto py-8">
              <div className="bg-white rounded-2xl shadow-2xl overflow-hidden">
                <div className="bg-gradient-to-r from-purple-600 to-indigo-700 p-8 text-white">
                  <h1 className="text-4xl font-bold mb-2">
                    🎓 {t.resultsTitle}
                  </h1>
                  <p className="text-purple-100">{t.resultsSubtitle}</p>
                </div>

                <div className="p-8">
                  <div className="mb-8">
                    <h2 className="text-2xl font-bold mb-4">
                      {t.overallReadiness}
                    </h2>
                    <div
                      className={`${levelColors[overallLevel].bg} ${levelColors[overallLevel].border} border-2 rounded-lg p-6`}
                    >
                      <div className="flex items-center justify-between mb-4">
                        <div className="flex items-center gap-3">
                          <span className="text-5xl">
                            {levelColors[overallLevel].emoji}
                          </span>
                          <div>
                            <h3
                              className={`text-2xl font-bold ${levelColors[overallLevel].text}`}
                            >
                              {levelColors[overallLevel].name}
                            </h3>
                            <p className="text-gray-700">{readiness.level}</p>
                          </div>
                        </div>
                        <div className="text-right">
                          <div
                            className={`text-5xl font-bold ${levelColors[overallLevel].text}`}
                          >
                            {scores.overall}%
                          </div>
                          <p className="text-sm text-gray-600">
                            {readiness.weeks}
                          </p>
                        </div>
                      </div>
                      <p className="text-gray-700 italic">{readiness.desc}</p>
                    </div>
                  </div>

                  <div className="mb-8">
                    <h2 className="text-2xl font-bold mb-4">
                      {t.categoryScores}
                    </h2>
                    <div className="grid md:grid-cols-2 gap-4">
                      {categories.map((cat) => {
                        const score = scores[cat.id];
                        const level = getLevel(score);
                        return (
                          <div
                            key={cat.id}
                            className={`${levelColors[level].bg} border-2 ${levelColors[level].border} rounded-lg p-4`}
                          >
                            <div className="flex items-center justify-between mb-2">
                              <div className="flex items-center gap-2">
                                <span className="text-2xl">{cat.emoji}</span>
                                <span className="font-bold text-gray-800">
                                  {cat.name}
                                </span>
                              </div>
                              <span
                                className={`text-2xl font-bold ${levelColors[level].text}`}
                              >
                                {score}%
                              </span>
                            </div>
                            <div className="h-2 bg-gray-200 rounded-full overflow-hidden">
                              <div
                                className={`h-full ${cat.color
                                    .replace("from-", "bg-")
                                    .split(" ")[0]
                                  }`}
                                style={{ width: `${score}%` }}
                              ></div>
                            </div>
                          </div>
                        );
                      })}
                    </div>
                  </div>

                  {recommendations.length > 0 && (
                    <div className="mb-8">
                      <h2 className="text-2xl font-bold mb-4">
                        🎯 {t.priorityFocusAreas}
                      </h2>
                      <div className="space-y-4">
                        {recommendations.map((rec, i) => (
                          <div
                            key={i}
                            className="bg-red-50 border-2 border-red-200 rounded-lg p-4"
                          >
                            <div className="flex items-start gap-3">
                              <span className="text-3xl">{rec.emoji}</span>
                              <div className="flex-1">
                                <div className="flex justify-between items-center mb-2">
                                  <h3 className="font-bold text-gray-800">
                                    {rec.area}
                                  </h3>
                                  <span
                                    className={`text-xs font-bold px-3 py-1 rounded ${rec.priority === "Critical"
                                        ? "bg-red-200 text-red-800"
                                        : "bg-orange-200 text-orange-800"
                                      }`}
                                  >
                                    {t.priorityLabels[rec.priority]}{" "}
                                    {t.priority}
                                  </span>
                                </div>
                                <p className="text-sm text-gray-600 mb-2">
                                  {t.score}: {rec.score}%
                                </p>
                                <ul className="list-disc list-inside text-sm text-gray-700 space-y-1">
                                  {rec.actions.map((action, j) => (
                                    <li key={j}>{action}</li>
                                  ))}
                                </ul>
                              </div>
                            </div>
                          </div>
                        ))}
                      </div>
                    </div>
                  )}

                  <div className="mb-8">
                    <h2 className="text-2xl font-bold mb-4">
                      🗺️ {t.learningRoadmap}
                    </h2>
                    <div className="space-y-4">
                      {roadmap.map((phase, i) => (
                        <div
                          key={i}
                          className="border-l-4 border-indigo-500 pl-4 py-2 bg-indigo-50 rounded-r-lg"
                        >
                          <h3 className="font-bold text-indigo-900">
                            {phase.phase}
                          </h3>
                          <p className="text-sm text-indigo-700 mb-2">
                            {t.focus}:{" "}
                            {phase.focus.filter((f) => f).join(", ")}
                          </p>
                          <ul className="list-disc list-inside text-sm text-gray-700">
                            {phase.goals.map((goal, j) => (
                              <li key={j}>{goal}</li>
                            ))}
                          </ul>
                        </div>
                      ))}
                    </div>
                  </div>

                  <div className="text-center p-4 bg-gray-100 rounded-lg mb-6">
                    <p className="text-sm text-gray-700">
                      {t.workshopMessage}
                    </p>
                  </div>

                  <div className="flex gap-4">
                    <button
                      onClick={printResults}
                      className="flex-1 py-3 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-lg font-bold hover:opacity-90 transition"
                    >
                      {t.printButton}
                    </button>
                    <button
                      onClick={resetAssessment}
                      className="flex-1 py-3 bg-gradient-to-r from-gray-500 to-gray-600 text-white rounded-lg font-bold hover:opacity-90 transition"
                    >
                      🔄 {t.startNewAssessment}
                    </button>
                  </div>
                </div>
              </div>
            </div>
          </div>
        );
      }

      return null;
    }

    ReactDOM.render(<WorkshopAssessment />, document.getElementById("root"));
  </script>
  <script src="../menu.js"></script>
